<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KD-116 · Pavé Huggie · SHEER OBJECTS</title>
<style>
  :root{ --bg:#f4f2ee; --ink:#1c1a17; --ink-soft:#8a8880; --line:#dcd8d0; }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0}
  canvas{display:block}
  .frame{position:fixed;inset:0;pointer-events:none;padding:28px 32px;display:flex;flex-direction:column;justify-content:space-between}
  .head{display:flex;justify-content:space-between;align-items:flex-start}
  .head .brand{font-size:12px;letter-spacing:.34em;color:var(--ink-soft)}
  .head .piece{margin-top:6px;font-size:24px;font-weight:300;letter-spacing:.02em}
  .tag{position:fixed;top:28px;right:32px;text-align:right;font-size:11.5px;line-height:1.7;color:var(--ink-soft);letter-spacing:.05em}
  .foot{display:flex;justify-content:space-between;align-items:flex-end}
  .spec{font-size:12px;line-height:1.9;color:var(--ink-soft);letter-spacing:.04em}
  .spec b{color:var(--ink);font-weight:500}
  .metals{pointer-events:auto;display:flex;gap:8px}
  .metals button{pointer-events:auto;border:1px solid var(--line);background:transparent;color:var(--ink-soft);font-size:11.5px;letter-spacing:.08em;padding:8px 14px;cursor:pointer;transition:all .25s}
  .metals button.active{border-color:var(--ink);color:var(--ink)}
  .metals button:hover{border-color:var(--ink)}
  .hint{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);font-size:12px;color:var(--ink-soft);letter-spacing:.04em;transition:opacity .8s;pointer-events:none}
  .hint.gone{opacity:0}
  @media (max-width:640px){ .frame{padding:20px} .head .piece{font-size:20px} .tag{top:20px;right:20px} .spec{font-size:11.5px} .hint{bottom:110px} }
</style>
</head>
<body>
<div id="stage"></div>
<div class="frame">
  <div class="head">
    <div>
      <div class="brand">SHEER OBJECTS</div>
      <div class="piece">KD-116 · Pavé Huggie</div>
    </div>
  </div>
  <div class="foot">
    <div class="spec">
      <b>12.0 mm</b> outer · <b>1.7 mm</b> width · <b>1.5 mm</b> CZ × 7<br>
      925 silver · 14k gold vermeil 2.5µ
    </div>
    <div class="metals">
      <button id="btnGold" class="active">Gold</button>
      <button id="btnSilver">Silver</button>
    </div>
  </div>
</div>
<div class="tag">Three.js r186 build<br>synthetic studio light · mirror-pavilion stones</div>
<div class="hint" id="hint">Drag to rotate. Scroll or pinch to zoom.</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
